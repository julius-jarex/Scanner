name: Sweep IFVG Labor

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install numpy pandas

      - name: Backtest laufen lassen
        run: |
          python sweep_ifvg_tl_labor.py --kosten XAUUSD=0.20 | tee ergebnis.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ergebnis
          path: ergebnis.txt
