name: Sweep IFVG Labor

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install numpy pandas

      # Kursdaten werden nach dem ersten Lauf gespeichert -> spätere Läufe dauern nur Minuten
      - name: Kursdaten aus Cache holen
        uses: actions/cache@v4
        with:
          path: daten
          key: kursdaten-${{ github.run_id }}
          restore-keys: kursdaten-

      - name: Backtest laufen lassen
        run: |
          python -u sweep_ifvg_tl_labor.py --kosten XAUUSD=0.20 | tee ergebnis.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ergebnis
          path: ergebnis.txt
